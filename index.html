<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-V Recognize Practice & Visual Comparison</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --badge-bg: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-color);
            letter-spacing: 0.05em;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-label:hover {
            background-color: rgba(255, 255, 255, 0.06);
        }

        .checkbox-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* メインスクランブル表示エリア */
        .scramble-box-wrapper {
            position: relative;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px 16px 16px 16px;
            margin-bottom: 12px;
        }

        .pseudo-badge {
            position: absolute;
            top: 8px;
            left: 10px;
            background-color: var(--badge-bg);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.03em;
        }

        .scramble-box {
            font-family: monospace;
            font-size: 1.15rem;
            text-align: center;
            word-break: break-all;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.05em;
        }

        /* 答え合わせビジュアル比較パネル（左右2カラム） */
        .answer-panel {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .answer-panel.active {
            display: grid;
        }

        @media (max-width: 600px) {
            .answer-panel.active {
                grid-template-columns: 1fr;
            }
        }

        .state-card {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .state-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
            text-align: center;
        }

        .state-alg {
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            word-break: break-all;
            text-align: center;
            margin-bottom: 10px;
            min-height: 30px;
        }

        .visual-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 200px;
            height: 180px;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: grab;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        button.action-btn {
            flex: 1;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.secondary-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }

        button.secondary-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pseudo-V Recognize Practice</h1>

        <!-- Pseudo-V チェックボックス設定 -->
        <div class="section">
            <div class="section-title">Pseudo-V ターゲット選択 (未選択で純粋L4E)</div>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" name="pv" value="R" checked> R</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="R'" checked> R'</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="L" checked> L</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="L'" checked> L'</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="B" checked> B</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="B'" checked> B'</label>
            </div>
        </div>

        <!-- ブロック数スライダー設定 -->
        <div class="section">
            <div class="slider-container">
                <div class="slider-header">
                    <span class="section-title" style="margin:0;">ブロック数 (L4Eの複雑さ)</span>
                    <span id="slider-value" style="font-weight: 500;">5</span>
                </div>
                <input type="range" id="block-slider" min="2" max="8" value="5">
            </div>
        </div>

        <!-- スクランブル表示エリア -->
        <div class="section">
            <div class="section-title">スクランブル (Full Scramble)</div>
            
            <div class="scramble-box-wrapper">
                <div id="pseudo-badge" class="pseudo-badge">Pseudo: R</div>
                <div id="scramble-display" class="scramble-box">読み込み中...</div>
            </div>

            <!-- 答え合わせ：左右ビジュアル比較パネル -->
            <div id="answer-panel" class="answer-panel">
                <!-- 1つ目：フルスクランブル状態 -->
                <div class="state-card">
                    <div class="state-title">1. Full Scramble 適用状態</div>
                    <div id="full-alg-text" class="state-alg">-</div>
                    <div class="visual-container">
                        <img id="full-visual-img" src="" alt="Full Scramble State">
                    </div>
                </div>
                <!-- 2つ目：Pure L4E状態（Pseudoの1手を除いた状態） -->
                <div class="state-card">
                    <div class="state-title">2. Pure L4E 状態 (Pseudoなし)</div>
                    <div id="pure-alg-text" class="state-alg">-</div>
                    <div class="visual-container">
                        <img id="pure-visual-img" src="" alt="Pure L4E State">
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="action-btn secondary-btn" id="toggle-answer-btn">👁️ 答え合わせを表示</button>
                <button class="action-btn secondary-btn" id="copy-btn">📋 コピー</button>
            </div>
            <div class="btn-group" style="margin-top: 8px;">
                <button class="action-btn" id="generate-btn">🔄 次のスクランブル</button>
            </div>
        </div>
    </div>

    <script>
        const baseMoves = {
            1: "R U R'",
            2: "R U' R'",
            3: "L' U L",
            4: "L' U' L",
            5: "R' L R L'",
            6: "L R' L' R"
        };

        const moveGroups = {
            1: 1, 2: 1,
            3: 2, 4: 2,
            5: 3, 6: 3
        };

        const inverseMap = { 1: 2, 2: 1, 3: 4, 4: 3, 5: 6, 6: 5 };

        const slider = document.getElementById('block-slider');
        const sliderValue = document.getElementById('slider-value');
        slider.addEventListener('input', () => {
            sliderValue.textContent = slider.value;
        });

        let currentData = {
            full: "",
            pure: ""
        };

        // 共通の相殺処理エンジン
        function reduceMoveString(moveList) {
            let list = [...moveList];
            let changed = true;

            while (changed) {
                changed = false;
                for (let i = 0; i < list.length - 1; i++) {
                    let m1 = list[i];
                    let m2 = list[i+1];

                    if ((m1 === "R" && m2 === "R'") || (m1 === "R'" && m2 === "R") ||
                        (m1 === "L" && m2 === "L'") || (m1 === "L'" && m2 === "L") ||
                        (m1 === "B" && m2 === "B'") || (m1 === "B'" && m2 === "B") ||
                        (m1 === "U" && m2 === "U'") || (m1 === "U'" && m2 === "U")) {
                        
                        list.splice(i, 2);
                        changed = true;
                        break;
                    }
                }
            }
            return list;
        }

        function generateScramble() {
            const checkboxes = document.querySelectorAll('input[name="pv"]:checked');
            let activeCheckboxes = Array.from(checkboxes).map(cb => cb.value);

            let pseudoToken = "";
            let pureTokens = [];

            // 1. まず純粋なL4Eブロック列を生成
            let numBlocks = parseInt(slider.value);
            let lastGroup = -1;

            for (let i = 0; i < numBlocks; i++) {
                let blockLength = (Math.random() < 0.3) ? 2 : 1;
                
                let m1;
                do {
                    m1 = Math.floor(Math.random() * 6) + 1;
                } while (moveGroups[m1] === lastGroup);
                
                lastGroup = moveGroups[m1];
                pureTokens.push(...baseMoves[m1].split(" "));

                if (blockLength === 2) {
                    let m2;
                    do {
                        m2 = Math.floor(Math.random() * 6) + 1;
                    } while (m2 === inverseMap[m1] || moveGroups[m2] === lastGroup);
                    
                    lastGroup = moveGroups[m2];
                    pureTokens.push(...baseMoves[m2].split(" "));
                }

                if (i < numBlocks - 1) {
                    pureTokens.push(Math.random() < 0.5 ? "U" : "U'");
                }
            }

            if (Math.random() < 0.5) {
                pureTokens.push(Math.random() < 0.5 ? "U" : "U'");
            }

            // 2. 純粋L4Eの縮約完了
            let reducedPureTokens = reduceMoveString(pureTokens);
            currentData.pure = reducedPureTokens.join(" ");

            // 3. Pseudo-V 選択がある場合、先頭に1手合体させてフルスクランブルを作成
            if (activeCheckboxes.length > 0) {
                pseudoToken = activeCheckboxes[Math.floor(Math.random() * activeCheckboxes.length)];
                
                let combined = [pseudoToken, ...reducedPureTokens];
                let reducedFullTokens = reduceMoveString(combined);
                currentData.full = reducedFullTokens.join(" ");
            } else {
                currentData.full = currentData.pure;
            }

            // 4. 画面への反映
            document.getElementById('scramble-display').textContent = currentData.full;
            
            // 答え合わせパネル内のテキスト
            document.getElementById('full-alg-text').textContent = currentData.full;
            document.getElementById('pure-alg-text').textContent = currentData.pure;

            // VisualCube API 画像の設定 (URLエンコード)
            const encodedFull = encodeURIComponent(currentData.full);
            const encodedPure = encodeURIComponent(currentData.pure);
            document.getElementById('full-visual-img').src = `https://api.cuberoot.me/v1/visualcube.svg?alg=${encodedFull}&pzl=pyra`;
            document.getElementById('pure-visual-img').src = `https://api.cuberoot.me/v1/visualcube.svg?alg=${encodedPure}&pzl=pyra`;

            // バッジの表示切り替え（常に1手のみ表示）
            const badge = document.getElementById('pseudo-badge');
            if (pseudoToken) {
                badge.textContent = `Pseudo: ${pseudoToken}`;
                badge.style.display = "block";
            } else {
                badge.textContent = "Pure L4E";
                badge.style.backgroundColor = "#64748b";
                badge.style.display = "block";
            }

            // パネルを閉じる
            document.getElementById('answer-panel').classList.remove('active');
            document.getElementById('toggle-answer-btn').textContent = "👁️ 答え合わせを表示";
        }

        // 答え合わせトグルボタン
        document.getElementById('toggle-answer-btn').addEventListener('click', () => {
            const panel = document.getElementById('answer-panel');
            const btn = document.getElementById('toggle-answer-btn');
            panel.classList.toggle('active');
            btn.textContent = panel.classList.contains('active') ? "🙈 答え合わせを隠す" : "👁️ 答え合わせを表示";
        });

        // コピーボタン
        document.getElementById('copy-btn').addEventListener('click', async () => {
            const text = currentData.full;
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('copy-btn');
                const orig = btn.textContent;
                btn.textContent = '✨ コピー完了';
                setTimeout(() => btn.textContent = orig, 1500);
            } catch (err) {
                alert('コピーに失敗しました');
            }
        });

        document.getElementById('generate-btn').addEventListener('click', generateScramble);

        // 初回ロード時自動生成
        generateScramble();
    </script>
</body>
</html>

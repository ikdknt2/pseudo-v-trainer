<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-V Training</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --badge-bg: #3b82f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-color);
            letter-spacing: 0.05em;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-label:hover {
            background-color: rgba(255, 255, 255, 0.06);
        }

        .checkbox-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* メインスクランブル表示枠 */
        .scramble-box-wrapper {
            position: relative;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 38px 16px 16px 16px;
            margin-bottom: 16px;
        }

        .pseudo-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--badge-bg);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.03em;
            z-index: 2;
        }

        .scramble-box {
            font-family: monospace;
            font-size: 1.15rem;
            text-align: center;
            word-break: break-all;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.05em;
            line-height: 1.4;
        }

        /* 左右ビジュアル比較パネル */
        .answer-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .answer-panel {
                grid-template-columns: 1fr;
            }
        }

        .state-card {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-state-card {
            border-color: var(--accent);
        }

        .state-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            text-align: center;
        }

        .visual-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 200px;
            height: 180px;
            position: relative;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 答えがアクティブなときの状態切り替え */
        .visual-container.revealed .placeholder-text {
            display: none;
        }
        .visual-container.revealed img {
            display: block;
        }

        /* タイマーセクション（中央配置） */
        .timer-section {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .timer-display {
            font-family: monospace;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-color);
        }

        .timer-controls {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 280px;
        }

        .timer-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .timer-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .timer-btn.primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .timer-btn.primary:hover {
            background-color: var(--accent-hover);
        }

        /* 直近3回履歴の表示 */
        .history-list {
            display: flex;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        button.action-btn {
            flex: 1;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.secondary-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }

        button.secondary-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .shortcuts-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pseudo-V Recognition Practice Tool</h1>

        <!-- Pseudo-V チェックボックス設定 -->
        <div class="section">
            <div class="section-title">Pseudo-V の種類を選択(選択なしでただのL4E)</div>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" name="pv" value="R" checked> R</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="R'" checked> R'</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="L" checked> L</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="L'" checked> L'</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="B" checked> B</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="B'" checked> B'</label>
            </div>
        </div>

        <!-- メインのスクランブル表示エリア -->
        <div class="section">
            <div class="section-title">スクランブル</div>
            <div class="scramble-box-wrapper">
                <div id="pseudo-badge" class="pseudo-badge">Pseudo: R</div>
                <div id="scramble-display" class="scramble-box">読み込み中...</div>
            </div>

            <!-- 左右ビジュアル比較エリア -->
            <div class="answer-panel">
                <!-- 1つ目：フルスクランブル状態の画像 -->
                <div class="state-card main-state-card">
                    <div class="state-title">スクランブル</div>
                    <div class="visual-container revealed">
                        <img id="full-visual-img" src="" alt="Full Scramble State">
                    </div>
                </div>

                <!-- 2つ目：Pure L4E状態（枠は常時固定、中はHidden） -->
                <div class="state-card">
                    <div class="state-title">答え(回すべきL4E)</div>
                    <div id="pure-visual-box" class="visual-container">
                        <span class="placeholder-text">Hidden</span>
                        <img id="pure-visual-img" src="" alt="Pure L4E State">
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="action-btn secondary-btn" id="toggle-answer-btn">答え合わせを表示 (Shift+Enter)</button>
                <button class="action-btn secondary-btn" id="copy-btn">コピー</button>
            </div>

            <!-- タイマーセクション -->
            <div class="timer-section">
                <div id="timer-display" class="timer-display">0.00s</div>
                <div class="timer-controls">
                    <button id="timer-action-btn" class="timer-btn primary">スタート</button>
                    <button id="timer-reset-btn" class="timer-btn">リセット</button>
                </div>
                <div class="history-list" id="history-list">
                    <span style="color: var(--text-muted); font-size: 0.75rem;">直近3回の履歴なし</span>
                </div>
            </div>

            <div class="btn-group">
                <button class="action-btn" id="generate-btn">🔄 次のスクランブル (Ctrl+Enter)</button>
            </div>

            <div class="shortcuts-hint">
                ショートカット: [Space] タイマースタート / [実行中の任意のキー・ボタン] ストップ | [Shift+Enter] 答え合わせ | [Ctrl+Enter] 次のスクランブル
            </div>
        </div>
    </div>

    <script>
        const baseMoves = {
            1: "R U R'",
            2: "R U' R'",
            3: "L' U L",
            4: "L' U' L",
            5: "R' L R L'",
            6: "L R' L' R"
        };

        const moveGroups = {
            1: 1, 2: 1,
            3: 2, 4: 2,
            5: 3, 6: 3
        };

        const inverseMap = { 1: 2, 2: 1, 3: 4, 4: 3, 5: 6, 6: 5 };

        let currentData = {
            full: "",
            pure: ""
        };

        // タイマー状態変数
        let timerState = 'stopped'; // 'stopped' | 'running' | 'finished'
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let recentTimes = [];

        const timerDisplay = document.getElementById('timer-display');
        const timerActionBtn = document.getElementById('timer-action-btn');
        const timerResetBtn = document.getElementById('timer-reset-btn');
        const historyList = document.getElementById('history-list');

        function formatTime(ms) {
            return (ms / 1000).toFixed(2) + 's';
        }

        function updateTimerDisplay() {
            let currentMs = elapsedTime;
            if (timerState === 'running') {
                currentMs = Date.now() - startTime;
            }
            timerDisplay.textContent = formatTime(currentMs);
        }

        function startTimer() {
            if (timerState === 'finished') return; // リセットするまで再スタート不可
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(updateTimerDisplay, 10);
            timerState = 'running';
            timerActionBtn.textContent = 'ストップ';
        }

        function stopTimer() {
            if (timerState !== 'running') return;
            clearInterval(timerInterval);
            elapsedTime = Date.now() - startTime;
            timerState = 'finished';
            timerActionBtn.textContent = 'スタート';
            updateTimerDisplay();

            // 終了時に直近履歴へ追加（最新が左、最大3件）
            recentTimes.unshift(elapsedTime);
            if (recentTimes.length > 3) recentTimes.pop();
            renderHistory();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerState = 'stopped';
            startTime = 0;
            elapsedTime = 0;
            timerDisplay.textContent = '0.00s';
            timerActionBtn.textContent = 'スタート';
        }

        function renderHistory() {
            if (recentTimes.length === 0) {
                historyList.innerHTML = '<span style="color: var(--text-muted); font-size: 0.75rem;">直近3回の履歴なし</span>';
                return;
            }
            historyList.innerHTML = recentTimes.map((t, idx) => `
                <div class="history-item">${idx === 0 ? '1st' : idx === 1 ? '2nd' : '3rd'}: ${formatTime(t)}</div>
            `).join('');
        }

        timerActionBtn.addEventListener('click', () => {
            if (timerState === 'stopped') {
                startTimer();
            } else if (timerState === 'running') {
                stopTimer();
            }
        });

        timerResetBtn.addEventListener('click', resetTimer);

        // 拡張された相殺・マージ処理エンジン
        function reduceMoveString(moveList) {
            let list = [...moveList];
            let changed = true;

            while (changed) {
                changed = false;
                
                for (let i = 0; i < list.length - 1; i++) {
                    let m1 = list[i];
                    let m2 = list[i+1];

                    if ((m1 === "R" && m2 === "R") || (m1 === "R'" && m2 === "R'")) {
                        list.splice(i, 2, (m1 === "R") ? "R'" : "R");
                        changed = true;
                        break;
                    }
                    if ((m1 === "L" && m2 === "L") || (m1 === "L'" && m2 === "L'")) {
                        list.splice(i, 2, (m1 === "L") ? "L'" : "L");
                        changed = true;
                        break;
                    }
                    if ((m1 === "B" && m2 === "B") || (m1 === "B'" && m2 === "B'")) {
                        list.splice(i, 2, (m1 === "B") ? "B'" : "B");
                        changed = true;
                        break;
                    }
                    if ((m1 === "U" && m2 === "U") || (m1 === "U'" && m2 === "U'")) {
                        list.splice(i, 2, (m1 === "U") ? "U'" : "U");
                        changed = true;
                        break;
                    }
                }

                if (changed) continue;

                for (let i = 0; i < list.length - 1; i++) {
                    let m1 = list[i];
                    let m2 = list[i+1];

                    if ((m1 === "R" && m2 === "R'") || (m1 === "R'" && m2 === "R") ||
                        (m1 === "L" && m2 === "L'") || (m1 === "L'" && m2 === "L") ||
                        (m1 === "B" && m2 === "B'") || (m1 === "B'" && m2 === "B") ||
                        (m1 === "U" && m2 === "U'") || (m1 === "U'" && m2 === "U")) {
                        
                        list.splice(i, 2);
                        changed = true;
                        break;
                    }
                }
            }
            return list;
        }

        function generateScramble() {
            const checkboxes = document.querySelectorAll('input[name="pv"]:checked');
            let activeCheckboxes = Array.from(checkboxes).map(cb => cb.value);

            let pseudoToken = "";
            let pureTokens = [];

            // 5ブロック固定で生成
            let numBlocks = 5;
            let lastGroup = -1;

            for (let i = 0; i < numBlocks; i++) {
                let blockLength = (Math.random() < 0.3) ? 2 : 1;
                
                let m1;
                do {
                    m1 = Math.floor(Math.random() * 6) + 1;
                } while (moveGroups[m1] === lastGroup);
                
                lastGroup = moveGroups[m1];
                pureTokens.push(...baseMoves[m1].split(" "));

                if (blockLength === 2) {
                    let m2;
                    do {
                        m2 = Math.floor(Math.random() * 6) + 1;
                    } while (m2 === inverseMap[m1] || moveGroups[m2] === lastGroup);
                    
                    lastGroup = moveGroups[m2];
                    pureTokens.push(...baseMoves[m2].split(" "));
                }

                if (i < numBlocks - 1) {
                    pureTokens.push(Math.random() < 0.5 ? "U" : "U'");
                }
            }

            if (Math.random() < 0.5) {
                pureTokens.push(Math.random() < 0.5 ? "U" : "U'");
            }

            let reducedPureTokens = reduceMoveString(pureTokens);
            currentData.pure = reducedPureTokens.join(" ");

            if (activeCheckboxes.length > 0) {
                pseudoToken = activeCheckboxes[Math.floor(Math.random() * activeCheckboxes.length)];
                let combined = [pseudoToken, ...reducedPureTokens];
                let reducedFullTokens = reduceMoveString(combined);
                currentData.full = reducedFullTokens.join(" ");
            } else {
                currentData.full = currentData.pure;
            }

            document.getElementById('scramble-display').textContent = currentData.full;

            const encodedFull = encodeURIComponent(currentData.full);
            const encodedPure = encodeURIComponent(currentData.pure);
            document.getElementById('full-visual-img').src = `https://api.cuberoot.me/v1/visualcube.svg?alg=${encodedFull}&pzl=pyra`;
            document.getElementById('pure-visual-img').src = `https://api.cuberoot.me/v1/visualcube.svg?alg=${encodedPure}&pzl=pyra`;

            const badge = document.getElementById('pseudo-badge');
            if (pseudoToken) {
                badge.textContent = `Pseudo: ${pseudoToken}`;
                badge.style.display = "block";
            } else {
                badge.textContent = "Pure L4E";
                badge.style.backgroundColor = "#64748b";
                badge.style.display = "block";
            }

            // 新規スクランブル生成時に答えを非表示にリセット
            document.getElementById('pure-visual-box').classList.remove('revealed');
            document.getElementById('toggle-answer-btn').textContent = "答え合わせを表示 (Shift+Enter)";

            // タイマーも確実にリセット
            resetTimer();
            recentTimes = [];
            renderHistory();
        }

        // 答え合わせトグル処理
        function toggleAnswer() {
            const pureBox = document.getElementById('pure-visual-box');
            const btn = document.getElementById('toggle-answer-btn');
            pureBox.classList.toggle('revealed');
            const isRevealed = pureBox.classList.contains('revealed');
            btn.textContent = isRevealed ? "答え合わせを隠す (Shift+Enter)" : "答え合わせを表示 (Shift+Enter)";
        }

        document.getElementById('toggle-answer-btn').addEventListener('click', toggleAnswer);

        // コピーボタン
        document.getElementById('copy-btn').addEventListener('click', async () => {
            const text = currentData.full;
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('copy-btn');
                const orig = btn.textContent;
                btn.textContent = 'コピー完了';
                setTimeout(() => btn.textContent = orig, 1500);
            } catch (err) {
                alert('コピーに失敗しました');
            }
        });

        document.getElementById('generate-btn').addEventListener('click', generateScramble);

        // キーボードショートカット設定
        window.addEventListener('keydown', (e) => {
            // 入力要素などにフォーカスがある場合を除外するため body 直下の判定にする
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault(); // 画面スクロール防止
                if (timerState === 'stopped') {
                    startTimer();
                } else if (timerState === 'running') {
                    stopTimer();
                }
            } else if (timerState === 'running') {
                // タイマー稼働中はどのキーを押してもストップできる
                stopTimer();
            } else if (e.shiftKey && e.key === 'Enter') {
                e.preventDefault();
                toggleAnswer();
            } else if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                generateScramble();
            }
        });

        // 初回ロード時自動生成
        generateScramble();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-V Recognize Practice</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-color);
            letter-spacing: 0.05em;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-label:hover {
            background-color: rgba(255, 255, 255, 0.06);
        }

        .checkbox-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .scramble-box {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 1.15rem;
            text-align: center;
            word-break: break-all;
            margin-bottom: 12px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.05em;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            flex: 1;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.secondary-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }

        button.secondary-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pseudo-V Recognize Practice</h1>

        <!-- Pseudo-V チェックボックス設定 -->
        <div class="section">
            <div class="section-title">Pseudo-V ターゲット選択 (未選択で純粋L4E)</div>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" name="pv" value="R" checked> R</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="R'" checked> R'</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="L" checked> L</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="L'" checked> L'</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="B" checked> B</label>
                <label class="checkbox-label"><input type="checkbox" name="pv" value="B'" checked> B'</label>
            </div>
        </div>

        <!-- ブロック数スライダー設定 -->
        <div class="section">
            <div class="slider-container">
                <div class="slider-header">
                    <span class="section-title" style="margin:0;">ブロック数 (L4Eの複雑さ)</span>
                    <span id="slider-value" style="font-weight: 500;">5</span>
                </div>
                <input type="range" id="block-slider" min="2" max="8" value="5">
            </div>
        </div>

        <!-- スクランブル表示エリア -->
        <div class="section">
            <div class="section-title">スクランブル</div>
            <div id="scramble-display" class="scramble-box">生成ボタンを押してください</div>
            <div class="btn-group">
                <button class="action-btn secondary-btn" id="copy-btn">📋 コピー</button>
                <button class="action-btn" id="generate-btn">🔄 次のスクランブル</button>
            </div>
        </div>
    </div>

    <script>
        const baseMoves = {
            1: "R U R'",
            2: "R U' R'",
            3: "L' U L",
            4: "L' U' L",
            5: "R' L R L'",
            6: "L R' L' R"
        };

        const moveGroups = {
            1: 1, 2: 1,
            3: 2, 4: 2,
            5: 3, 6: 3
        };

        const inverseMap = { 1: 2, 2: 1, 3: 4, 4: 3, 5: 6, 6: 5 };

        const slider = document.getElementById('block-slider');
        const sliderValue = document.getElementById('slider-value');
        slider.addEventListener('input', () => {
            sliderValue.textContent = slider.value;
        });

        // 徹底的な連鎖的相殺処理（console.log進捗出力付き）
        function reduceMoveStringWithLogs(moveList) {
            console.log("=== 【縮約開始】初期トークン列 ===", moveList.join(" "));
            
            let list = [...moveList];
            let passCount = 1;
            let changed = true;

            while (changed) {
                changed = false;
                console.log(`--- パス ${passCount} 処理前 ---`, list.join(" "));

                for (let i = 0; i < list.length - 1; i++) {
                    let m1 = list[i];
                    let m2 = list[i+1];

                    // 逆手順の相殺 (例: R と R', L と L' など)
                    if ((m1 === "R" && m2 === "R'") || (m1 === "R'" && m2 === "R") ||
                        (m1 === "L" && m2 === "L'") || (m1 === "L'" && m2 === "L") ||
                        (m1 === "B" && m2 === "B'") || (m1 === "B'" && m2 === "B") ||
                        (m1 === "U" && m2 === "U'") || (m1 === "U'" && m2 === "U")) {
                        
                        console.log(`  -> 【相殺・削除】インデックス ${i}, ${i+1} の [${m1}] と [${m2}] を削除します`);
                        list.splice(i, 2);
                        changed = true;
                        break; // 変更があったら一度ループを抜けて最初から再スキャン（連鎖対応）
                    }
                }

                if (changed) {
                    console.log(`--- パス ${passCount} 処理後 ---`, list.join(" "));
                    passCount++;
                } else {
                    console.log("=== 【縮約完了】これ以上変化するペアはありません ===");
                }
            }
            return list;
        }

        function generateScramble() {
            const checkboxes = document.querySelectorAll('input[name="pv"]:checked');
            let activeCheckboxes = Array.from(checkboxes).map(cb => cb.value);

            let tokens = [];

            // チェックが選択されている場合のみ Pseudo-V（冒頭の回転）を追加
            if (activeCheckboxes.length > 0) {
                let randomPseudo = activeCheckboxes[Math.floor(Math.random() * activeCheckboxes.length)];
                tokens.push(randomPseudo);

                if (Math.random() < 0.5) {
                    tokens.push(Math.random() < 0.5 ? "U" : "U'");
                }
            }

            let numBlocks = parseInt(slider.value);
            let lastGroup = -1;

            for (let i = 0; i < numBlocks; i++) {
                let blockLength = (Math.random() < 0.3) ? 2 : 1;
                
                let m1;
                do {
                    m1 = Math.floor(Math.random() * 6) + 1;
                } while (moveGroups[m1] === lastGroup);
                
                lastGroup = moveGroups[m1];
                tokens.push(...baseMoves[m1].split(" "));

                if (blockLength === 2) {
                    let m2;
                    do {
                        m2 = Math.floor(Math.random() * 6) + 1;
                    } while (m2 === inverseMap[m1] || moveGroups[m2] === lastGroup);
                    
                    lastGroup = moveGroups[m2];
                    tokens.push(...baseMoves[m2].split(" "));
                }

                if (i < numBlocks - 1) {
                    tokens.push(Math.random() < 0.5 ? "U" : "U'");
                }
            }

            if (Math.random() < 0.5) {
                tokens.push(Math.random() < 0.5 ? "U" : "U'");
            }

            // ログ付き連鎖縮約エンジンの実行
            let reducedTokens = reduceMoveStringWithLogs(tokens);

            const scrambleString = reducedTokens.join(" ");
            document.getElementById('scramble-display').textContent = scrambleString;
        }

        document.getElementById('generate-btn').addEventListener('click', generateScramble);

        document.getElementById('copy-btn').addEventListener('click', async () => {
            const text = document.getElementById('scramble-display').textContent;
            if (!text || text.includes("生成ボタン")) return;
            try {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('copy-btn');
                const orig = btn.textContent;
                btn.textContent = '✨ コピー完了';
                setTimeout(() => btn.textContent = orig, 1500);
            } catch (err) {
                alert('コピーに失敗しました');
            }
        });

        generateScramble();
    </script>
</body>
</html>
